name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  quality:
    name: Code Quality

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: app_password
          POSTGRES_DB: app_db_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U app_user -d app_db_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.5.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: postgresql://app_user:app_password@localhost:5432/app_db_test

      - name: Run database migrations
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://app_user:app_password@localhost:5432/app_db_test

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
        env:
          NODE_ENV: test
          PORT: 3000
          DATABASE_URL: postgresql://app_user:app_password@localhost:5432/app_db_test
          DATABASE_URL_TEST: postgresql://app_user:app_password@localhost:5432/app_db_test
          JWT_ACCESS_SECRET: ci-test-access-secret-01234567890123456789
          JWT_ACCESS_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d
          GOOGLE_CLIENT_ID: ci-test-google-client-id
          GOOGLE_CLIENT_SECRET: ci-test-google-client-secret
          GOOGLE_REDIRECT_URI: http://localhost:3000/api/v1/auth/google/callback
          REDIS_URL: redis://localhost:6379
          CORS_ORIGINS: http://localhost:5173

      - name: Build
        run: pnpm build
